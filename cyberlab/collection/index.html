<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Ma collection — CyberLab</title><style>body{margin:0;background:#08111f;color:#eef5ff;font-family:system-ui;padding:30px}main{max-width:1000px;margin:auto}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.nav a{color:#dff4ff;background:#132640;border:1px solid #294366;padding:9px 12px;border-radius:9px;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{background:#12213a;border:2px solid #4d607a;border-radius:18px;padding:18px}.rare{border-color:#63b5ff}.epic{border-color:#b98cff}.legendary{border-color:#ffd76b}.result{font-size:1.8rem;font-weight:800;margin:12px 0}.muted{color:#aab9cd}.empty{padding:20px;border:1px solid #294366;border-radius:14px}</style></head><body><main><nav class="nav"><a href="../">CyberLab</a><a href="./">Ma collection</a><a href="../questionnaire/">Questionnaire</a><a href="../account/">Connexion</a></nav><h1>Ma collection</h1><p class="muted">Les cartes obtenues avec les résultats de CyberCalc sont enregistrées sur cet appareil.</p><div id="collection" class="grid"></div></main><script>function render(){let cards=[];try{cards=JSON.parse(localStorage.getItem('mathcards')||'[]')}catch{}const labels={common:'Commune',rare:'Rare',epic:'Épique',legendary:'Légendaire'};collection.innerHTML=cards.length?cards.map(c=>'<article class="card '+c.rarity+'"><div>'+c.type+'</div><h2>'+c.name+'</h2><div class="result">'+c.result+'</div><p class="muted">'+c.expression+'</p><small>'+labels[c.rarity]+' · '+new Date(c.date).toLocaleDateString('fr-FR')+'</small></article>').join(''):'<div class="empty">Aucune carte pour le moment. Fais un calcul dans CyberCalc pour obtenir ta première carte.</div>'}render()</script></body></html>
