<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Connexion — CyberLab</title><style>body{margin:0;background:#08111f;color:#eef5ff;font-family:system-ui;padding:30px}main{max-width:650px;margin:auto}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.nav a{color:#dff4ff;background:#132640;border:1px solid #294366;padding:9px 12px;border-radius:9px;text-decoration:none}.card{background:#12213a;border:1px solid #294366;border-radius:18px;padding:20px}.form{display:grid;gap:11px}input{padding:11px;background:#091321;color:white;border:1px solid #294366;border-radius:10px}.btn{padding:11px 15px;border-radius:10px;border:1px solid #42638a;background:#18304d;color:white;cursor:pointer}.notice{padding:12px;background:#10253c;border:1px solid #42638a;border-radius:12px;color:#bdd9f5}</style></head><body><main><nav class="nav"><a href="../">CyberLab</a><a href="../collection/">Ma collection</a><a href="../questionnaire/">Questionnaire</a><a href="./">Connexion</a></nav><h1>Connexion</h1><div class="notice">La collection fonctionne sans connexion sur cet appareil. Pour la synchroniser entre plusieurs appareils, il faut configurer un projet Supabase personnel.</div><section class="card" style="margin-top:16px"><div class="form"><input id="url" placeholder="URL du projet Supabase"><input id="key" placeholder="Clé publique / publishable key"><button class="btn" onclick="saveConfig()">Enregistrer la configuration</button><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mot de passe"><button class="btn" onclick="signup()">Créer un compte</button><button class="btn" onclick="login()">Se connecter</button><button class="btn" onclick="logout()">Se déconnecter</button><div id="out"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client=null;function init(){const u=localStorage.getItem('sb_url'),k=localStorage.getItem('sb_key');if(u&&k){url.value=u;key.value=k;client=supabase.createClient(u,k,{auth:{persistSession:true}})}}function saveConfig(){localStorage.setItem('sb_url',url.value.trim());localStorage.setItem('sb_key',key.value.trim());init();out.textContent='Configuration enregistrée.'}async function signup(){if(!client){out.textContent='Configure Supabase d’abord.';return}const {error}=await client.auth.signUp({email:email.value.trim(),password:password.value});out.textContent=error?error.message:'Compte créé. Vérifie ton email si nécessaire.'}async function login(){if(!client){out.textContent='Configure Supabase d’abord.';return}const {error}=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});out.textContent=error?error.message:'Connexion réussie.'}async function logout(){if(client)await client.auth.signOut();out.textContent='Déconnecté.'}init()</script></body></html>
