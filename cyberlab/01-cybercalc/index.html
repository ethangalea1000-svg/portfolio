<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CyberCalc</title><style>body{font-family:system-ui;max-width:600px;margin:40px auto;padding:20px}input,button{font-size:1.1rem;padding:10px;margin:4px}#out{font-size:1.5rem}</style><h1>CyberCalc</h1><p>Calculatrice scientifique simple.</p><input id="a" type="number" value="12"><select id="op"><option>+</option><option>-</option><option>*</option><option>/</option><option>^</option></select><input id="b" type="number" value="4"><button onclick="calc()">Calculer</button><p id="out"></p><script>function calc(){const a=+document.querySelector('#a').value,b=+document.querySelector('#b').value,o=document.querySelector('#op').value;let r=o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:o==='/'?(b===0?'Division impossible':a/b):Math.pow(a,b);document.querySelector('#out').textContent=r}</script></html>
