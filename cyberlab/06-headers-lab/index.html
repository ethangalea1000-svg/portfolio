<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Headers Lab</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px}textarea{width:100%;height:260px}</style><link rel="stylesheet" href="../ui.css"><link rel="icon" href="../../logo.png" type="image/png"></head><body><div class="cyberlab-brandbar"><a class="brand-main" href="../"><img src="../../logo.png" alt="Logo Ethan GALEA"><span>CyberLab</span></a><span class="pill">ETHAN GALEA</span><a href="../">Projets</a><a href="../collection/">Collection</a><a href="../11-cyberacademy/">Académie</a><a href="../account/">Connexion</a><a href="https://ethangalea1000-svg.github.io/portfolio/">Portfolio</a></div><main class="cyber-project-page"><h1>Headers Lab</h1><p>Colle des en-têtes HTTP que tu es autorisé à examiner.</p><textarea id="x" placeholder="Content-Security-Policy: ..."></textarea><button onclick="go()">Analyser</button><pre id="o"></pre><script>function go(){const wanted=['content-security-policy','strict-transport-security','x-content-type-options','referrer-policy','permissions-policy'];const lines=x.value.split(/\n/);o.textContent=wanted.map(k=>k+': '+(lines.some(l=>l.toLowerCase().startsWith(k+':'))?'présent':'absent')).join('\n')}</script></main><script src="../ui.js"></script></body></html>
