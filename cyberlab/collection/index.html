<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Ma collection — CyberLab</title><style>body{margin:0;background:#08111f;color:#eef5ff;font-family:system-ui;padding:30px}main{max-width:1000px;margin:auto}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.nav a{color:#dff4ff;background:#132640;border:1px solid #294366;padding:9px 12px;border-radius:9px;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{background:#12213a;border:2px solid #4d607a;border-radius:18px;padding:18px}.rare{border-color:#63b5ff}.epic{border-color:#b98cff}.legendary{border-color:#ffd76b}.result{font-size:1.8rem;font-weight:800;margin:12px 0}.muted{color:#aab9cd}.empty{padding:20px;border:1px solid #294366;border-radius:14px}</style><style id="cyberlab-brand-style">.cyberlab-brandbar{max-width:1180px;margin:12px auto 0;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(7,15,28,.82);border:1px solid rgba(95,142,184,.24);border-radius:16px;backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.18);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;position:relative;z-index:100}.cyberlab-brandbar a{text-decoration:none;color:#a9bbcf;padding:8px 10px;border-radius:10px;font-size:.88rem;transition:.18s}.cyberlab-brandbar a:hover{background:rgba(56,189,248,.11);color:#fff}.cyberlab-brandbar .brand-main{margin-right:auto;display:flex;align-items:center;gap:9px;color:#fff;font-weight:850}.cyberlab-brandbar .brand-main:hover{background:transparent}.cyberlab-brandbar img{width:34px;height:34px;object-fit:contain;padding:4px;border-radius:10px;background:#0b1525;border:1px solid rgba(56,189,248,.3);box-shadow:0 0 20px rgba(56,189,248,.12)}.cyberlab-brandbar .pill{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#7dd3fc}@media(max-width:620px){.cyberlab-brandbar{margin:8px;border-radius:13px}.cyberlab-brandbar .brand-main{width:100%;margin-right:0}.cyberlab-brandbar a{font-size:.8rem}}</style><link rel="icon" href="../../logo.png" type="image/png"><meta property="og:image" content="https://ethangalea1000-svg.github.io/portfolio/logo.png"><link rel="stylesheet" href="../ui.css">
</head><body><div class="cyberlab-brandbar"><a class="brand-main" href="../"><img src="../../logo.png" alt="Logo Ethan GALEA"><span>CyberLab</span></a><span class="pill">ETHAN GALEA</span><a href="../">Projets</a><a href="../collection/">Collection</a><a href="../questionnaire/">Questionnaire</a><a href="../account/">Connexion</a><a href="https://ethangalea1000-svg.github.io/portfolio/">Portfolio</a></div><main><nav class="nav"><a href="../">CyberLab</a><a href="./">Ma collection</a><a href="../questionnaire/">Questionnaire</a><a href="../account/">Connexion</a></nav><h1>Ma collection</h1><p class="muted">Les cartes obtenues avec les résultats de CyberCalc sont enregistrées sur cet appareil.</p><div id="collection" class="grid"></div></main><script>function render(){let cards=[];try{cards=JSON.parse(localStorage.getItem('mathcards')||'[]')}catch{}const labels={common:'Commune',rare:'Rare',epic:'Épique',legendary:'Légendaire'};collection.innerHTML=cards.length?cards.map(c=>'<article class="card '+c.rarity+'"><div>'+c.type+'</div><h2>'+c.name+'</h2><div class="result">'+c.result+'</div><p class="muted">'+c.expression+'</p><small>'+labels[c.rarity]+' · '+new Date(c.date).toLocaleDateString('fr-FR')+'</small></article>').join(''):'<div class="empty">Aucune carte pour le moment. Fais un calcul dans CyberCalc pour obtenir ta première carte.</div>'}render()</script><script src="../ui.js"></script>
</body></html>
