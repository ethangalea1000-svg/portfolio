<!doctype html><script>document.addEventListener('DOMContentLoaded',()=>{const n=document.createElement('nav');n.innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin:0 0 18px;background:#0b1729;border:1px solid #294366;border-radius:12px;font-family:system-ui"><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/" style="color:#dff4ff;text-decoration:none;padding:7px 10px">CyberLab</a><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/collection/" style="color:#69caff;text-decoration:none;padding:7px 10px">Ma collection</a><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/questionnaire/" style="color:#69caff;text-decoration:none;padding:7px 10px">Questionnaire</a><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/account/" style="color:#69caff;text-decoration:none;padding:7px 10px">Connexion</a></div>';document.body.insertBefore(n,document.body.firstChild)});</script><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hash Lab</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}textarea{width:100%;min-height:120px}button{padding:10px}</style><h1>Hash Lab</h1><p>Calcule une empreinte SHA-256 avec Web Crypto.</p><textarea id="t">Bonjour CyberLab</textarea><br><button onclick="go()">SHA-256</button><pre id="o"></pre><script>async function go(){const d=new TextEncoder().encode(document.querySelector('#t').value);const h=await crypto.subtle.digest('SHA-256',d);document.querySelector('#o').textContent=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}</script></html>
