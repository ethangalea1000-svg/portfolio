<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SocialNet Demo</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}.card{border:1px solid #ddd;border-radius:12px;padding:15px;margin:12px 0}button{padding:8px}</style><h1>SocialNet Demo</h1><p>Prototype local utilisant uniquement des profils fictifs.</p><div id="feed"></div><script>const posts=[['Alex','Premier post sur la sécurité numérique.'],['Sam','Je découvre le chiffrement côté navigateur.'],['Noa','Objectif : apprendre un concept cyber par jour.']];feed.innerHTML=posts.map((p,i)=>'<article class="card"><b>'+p[0]+'</b><p>'+p[1]+'</p><button onclick="this.textContent=\'Aimé ✓\'">J’aime</button></article>').join('')</script></html>
