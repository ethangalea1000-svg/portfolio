<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hash Lab</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}textarea{width:100%;min-height:120px}button{padding:10px}</style><h1>Hash Lab</h1><p>Calcule une empreinte SHA-256 avec Web Crypto.</p><textarea id="t">Bonjour CyberLab</textarea><br><button onclick="go()">SHA-256</button><pre id="o"></pre><script>async function go(){const d=new TextEncoder().encode(document.querySelector('#t').value);const h=await crypto.subtle.digest('SHA-256',d);document.querySelector('#o').textContent=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}</script></html>
