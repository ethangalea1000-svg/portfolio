<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Lab</title><style>body{font-family:system-ui;max-width:650px;margin:40px auto;padding:20px}input{width:100%;padding:12px;font-size:1rem}meter{width:100%;height:25px}</style><link rel="stylesheet" href="../ui.css"><link rel="icon" href="../../logo.png" type="image/png"></head><body><div class="cyberlab-brandbar"><a class="brand-main" href="../"><img src="../../logo.png" alt="Logo Ethan GALEA"><span>CyberLab</span></a><span class="pill">ETHAN GALEA</span><a href="../">Projets</a><a href="../collection/">Collection</a><a href="../11-cyberacademy/">Académie</a><a href="../account/">Connexion</a><a href="https://ethangalea1000-svg.github.io/portfolio/">Portfolio</a></div><main class="cyber-project-page"><h1>Password Lab</h1><p>Analyse locale indicative : le mot de passe n'est envoyé nulle part.</p><input id="p" type="password" autocomplete="off" oninput="go()" placeholder="Saisis un exemple"><meter id="m" min="0" max="5" value="0"></meter><p id="r"></p><script>function go(){const p=document.querySelector('#p').value;let s=0;if(p.length>=12)s++;if(/[a-z]/.test(p))s++;if(/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;document.querySelector('#m').value=s;document.querySelector('#r').textContent=s<3?'À renforcer':s<5?'Correct':'Robuste selon ces critères simples'}</script></main><script src="../ui.js"></script></body></html>
