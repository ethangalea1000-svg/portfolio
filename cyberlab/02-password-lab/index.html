<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Lab</title><style>body{font-family:system-ui;max-width:650px;margin:40px auto;padding:20px}input{width:100%;padding:12px;font-size:1rem}meter{width:100%;height:25px}</style><link rel="stylesheet" href="../ui.css"><link rel="icon" href="../../logo.png" type="image/png"><style id="cyberlab-footer-style">
.cyberlab-footer{max-width:1180px;margin:38px auto 20px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid rgba(132,164,199,.18);border-radius:18px;background:rgba(7,14,26,.76);box-shadow:0 14px 35px rgba(0,0,0,.18);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.cyberlab-footer-brand{display:flex;align-items:center;gap:10px}.cyberlab-footer-brand img{width:38px;height:38px;object-fit:contain;padding:4px;border-radius:11px;background:#0b1525;border:1px solid rgba(56,189,248,.28)}.cyberlab-footer-brand strong,.cyberlab-footer-brand span{display:block}.cyberlab-footer-brand span{font-size:.78rem;color:#7890a8;margin-top:2px}
.cyberlab-footer-links{display:flex;gap:7px;flex-wrap:wrap}.cyberlab-footer-links a{padding:8px 10px;border-radius:10px;color:#9fb3c7;text-decoration:none;border:1px solid transparent}.cyberlab-footer-links a:hover{color:#fff;background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.15)}
@media(max-width:650px){.cyberlab-footer{align-items:flex-start}.cyberlab-footer-links{width:100%}.cyberlab-footer-links a{font-size:.82rem}}
</style></head><body><main class="cyber-project-page"><h1>Password Lab</h1><p>Analyse locale indicative : le mot de passe n'est envoyé nulle part.</p><input id="p" type="password" autocomplete="off" oninput="go()" placeholder="Saisis un exemple"><meter id="m" min="0" max="5" value="0"></meter><p id="r"></p><script>function go(){const p=document.querySelector('#p').value;let s=0;if(p.length>=12)s++;if(/[a-z]/.test(p))s++;if(/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;document.querySelector('#m').value=s;document.querySelector('#r').textContent=s<3?'À renforcer':s<5?'Correct':'Robuste selon ces critères simples'}</script></main><script src="../ui.js"></script></body></html>
