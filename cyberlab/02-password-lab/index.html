<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Password Lab</title><style>body{font-family:system-ui;max-width:650px;margin:40px auto;padding:20px}input{width:100%;padding:12px;font-size:1rem}meter{width:100%;height:25px}</style><h1>Password Lab</h1><p>Analyse locale indicative : le mot de passe n'est envoyé nulle part.</p><input id="p" type="password" autocomplete="off" oninput="go()" placeholder="Saisis un exemple"><meter id="m" min="0" max="5" value="0"></meter><p id="r"></p><script>function go(){const p=document.querySelector('#p').value;let s=0;if(p.length>=12)s++;if(/[a-z]/.test(p))s++;if(/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;document.querySelector('#m').value=s;document.querySelector('#r').textContent=s<3?'À renforcer':s<5?'Correct':'Robuste selon ces critères simples'}</script></html>
