<!doctype html><script>document.addEventListener('DOMContentLoaded',()=>{const n=document.createElement('nav');n.innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin:0 0 18px;background:#0b1729;border:1px solid #294366;border-radius:12px;font-family:system-ui"><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/" style="color:#dff4ff;text-decoration:none;padding:7px 10px">CyberLab</a><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/collection/" style="color:#69caff;text-decoration:none;padding:7px 10px">Ma collection</a><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/questionnaire/" style="color:#69caff;text-decoration:none;padding:7px 10px">Questionnaire</a><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/account/" style="color:#69caff;text-decoration:none;padding:7px 10px">Connexion</a></div>';document.body.insertBefore(n,document.body.firstChild)});</script><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Integrity Lab</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}</style><h1>Integrity Lab</h1><p>Sélectionne un fichier : son contenu est hashé localement dans ton navigateur.</p><input id="f" type="file"><pre id="o"></pre><script>f.onchange=async()=>{const file=f.files[0];if(!file)return;const h=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());o.textContent=file.name+'\n'+[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}</script></html>
