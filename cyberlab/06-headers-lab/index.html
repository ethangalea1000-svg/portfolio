<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Headers Lab</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px}textarea{width:100%;height:260px}</style><h1>Headers Lab</h1><p>Colle des en-têtes HTTP que tu es autorisé à examiner.</p><textarea id="x" placeholder="Content-Security-Policy: ..."></textarea><button onclick="go()">Analyser</button><pre id="o"></pre><script>function go(){const wanted=['content-security-policy','strict-transport-security','x-content-type-options','referrer-policy','permissions-policy'];const lines=x.value.split(/\n/);o.textContent=wanted.map(k=>k+': '+(lines.some(l=>l.toLowerCase().startsWith(k+':'))?'présent':'absent')).join('\n')}</script></html>
