<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Integrity Lab</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}</style><h1>Integrity Lab</h1><p>Sélectionne un fichier : son contenu est hashé localement dans ton navigateur.</p><input id="f" type="file"><pre id="o"></pre><script>f.onchange=async()=>{const file=f.files[0];if(!file)return;const h=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());o.textContent=file.name+'\n'+[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}</script></html>
