<!doctype html><script>document.addEventListener('DOMContentLoaded',()=>{const n=document.createElement('nav');n.innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin:0 0 18px;background:#0b1729;border:1px solid #294366;border-radius:12px;font-family:system-ui"><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/" style="color:#dff4ff;text-decoration:none;padding:7px 10px">CyberLab</a><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/collection/" style="color:#69caff;text-decoration:none;padding:7px 10px">Ma collection</a><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/questionnaire/" style="color:#69caff;text-decoration:none;padding:7px 10px">Questionnaire</a><a href="https://ethangalea1000-svg.github.io/portfolio/cyberlab/account/" style="color:#69caff;text-decoration:none;padding:7px 10px">Connexion</a></div>';document.body.insertBefore(n,document.body.firstChild)});</script><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Crypto Messenger</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}textarea,input{width:100%;padding:10px;margin:5px 0}button{padding:10px}</style><h1>Crypto Messenger</h1><p>Démo locale : AES-GCM via Web Crypto. Les messages restent dans ton navigateur.</p><input id="key" type="password" placeholder="Clé de démonstration"><textarea id="msg" placeholder="Message"></textarea><button onclick="enc()">Chiffrer</button><pre id="out"></pre><script>const te=new TextEncoder();async function enc(){if(!key.value||!msg.value)return;const raw=await crypto.subtle.digest('SHA-256',te.encode(key.value));const k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(msg.value));const b=v=>btoa(String.fromCharCode(...new Uint8Array(v)));out.textContent='IV='+b(iv)+'\nCIPHERTEXT='+b(c)}</script></html>
