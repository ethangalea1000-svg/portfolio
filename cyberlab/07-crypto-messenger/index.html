<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Messenger</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}textarea,input{width:100%;padding:10px;margin:5px 0}button{padding:10px}</style><link rel="stylesheet" href="../ui.css"><link rel="icon" href="../../logo.png" type="image/png"></head><body><div class="cyberlab-brandbar"><a class="brand-main" href="../"><img src="../../logo.png" alt="Logo Ethan GALEA"><span>CyberLab</span></a><span class="pill">ETHAN GALEA</span><a href="../">Projets</a><a href="../collection/">Collection</a><a href="../11-cyberacademy/">Académie</a><a href="../account/">Connexion</a><a href="https://ethangalea1000-svg.github.io/portfolio/">Portfolio</a></div><main class="cyber-project-page"><h1>Crypto Messenger</h1><p>Démo locale : AES-GCM via Web Crypto. Les messages restent dans ton navigateur.</p><input id="key" type="password" placeholder="Clé de démonstration"><textarea id="msg" placeholder="Message"></textarea><button onclick="enc()">Chiffrer</button><pre id="out"></pre><script>const te=new TextEncoder();async function enc(){if(!key.value||!msg.value)return;const raw=await crypto.subtle.digest('SHA-256',te.encode(key.value));const k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(msg.value));const b=v=>btoa(String.fromCharCode(...new Uint8Array(v)));out.textContent='IV='+b(iv)+'\nCIPHERTEXT='+b(c)}</script></main><script src="../ui.js"></script></body></html>
