<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hash Lab</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}textarea{width:100%;min-height:120px}button{padding:10px}</style><link rel="stylesheet" href="../ui.css"><link rel="icon" href="../../logo.png" type="image/png"></head><body><div class="cyberlab-brandbar"><a class="brand-main" href="../"><img src="../../logo.png" alt="Logo Ethan GALEA"><span>CyberLab</span></a><span class="pill">ETHAN GALEA</span><a href="../">Projets</a><a href="../collection/">Collection</a><a href="../questionnaire/">Questionnaire</a><a href="../account/">Connexion</a><a href="https://ethangalea1000-svg.github.io/portfolio/">Portfolio</a></div><main class="cyber-project-page"><h1>Hash Lab</h1><p>Calcule une empreinte SHA-256 avec Web Crypto.</p><textarea id="t">Bonjour CyberLab</textarea><br><button onclick="go()">SHA-256</button><pre id="o"></pre><script>async function go(){const d=new TextEncoder().encode(document.querySelector('#t').value);const h=await crypto.subtle.digest('SHA-256',d);document.querySelector('#o').textContent=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}</script></main><script src="../ui.js"></script></body></html>
