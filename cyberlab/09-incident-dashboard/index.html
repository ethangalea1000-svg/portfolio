<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Incident Dashboard</title><style>body{font-family:system-ui;max-width:850px;margin:40px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.card{padding:20px;border:1px solid #ddd;border-radius:12px}</style><h1>Incident Dashboard</h1><p>Données entièrement simulées.</p><div class="grid" id="g"></div><script>const d=[['Ouverts',3],['En analyse',2],['Résolus',12],['Critiques',1]];g.innerHTML=d.map(x=>'<div class="card"><h2>'+x[1]+'</h2><p>'+x[0]+'</p></div>').join('')</script></html>
