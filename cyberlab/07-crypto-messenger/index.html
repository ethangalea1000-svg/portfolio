<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Messenger</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}textarea,input{width:100%;padding:10px;margin:5px 0}button{padding:10px}</style><link rel="stylesheet" href="../ui.css"><link rel="icon" href="../../logo.png" type="image/png"><style id="cyberlab-footer-style">.cyberlab-footer{max-width:1180px;margin:38px auto 20px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid rgba(132,164,199,.18);border-radius:18px;background:rgba(7,14,26,.76);box-shadow:0 14px 35px rgba(0,0,0,.18);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.cyberlab-footer-brand{display:flex;align-items:center;gap:10px}.cyberlab-footer-brand img{width:38px;height:38px;object-fit:contain;padding:4px;border-radius:11px;background:#0b1525;border:1px solid rgba(56,189,248,.28)}.cyberlab-footer-brand strong,.cyberlab-footer-brand span{display:block}.cyberlab-footer-brand span{font-size:.78rem;color:#7890a8;margin-top:2px}.cyberlab-footer-links{display:flex;gap:7px;flex-wrap:wrap}.cyberlab-footer-links a{padding:8px 10px;border-radius:10px;color:#9fb3c7;text-decoration:none;border:1px solid transparent}.cyberlab-footer-links a:hover{color:#fff;background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.15)}@media(max-width:650px){.cyberlab-footer{align-items:flex-start}.cyberlab-footer-links{width:100%}.cyberlab-footer-links a{font-size:.82rem}}</style></head><body><main class="cyber-project-page"><h1>Crypto Messenger</h1><p>Démo locale : AES-GCM via Web Crypto. Les messages restent dans ton navigateur.</p><input id="key" type="password" placeholder="Clé de démonstration"><textarea id="msg" placeholder="Message"></textarea><button onclick="enc()">Chiffrer</button><pre id="out"></pre><script>const te=new TextEncoder();async function enc(){if(!key.value||!msg.value)return;const raw=await crypto.subtle.digest('SHA-256',te.encode(key.value));const k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(msg.value));const b=v=>btoa(String.fromCharCode(...new Uint8Array(v)));out.textContent='IV='+b(iv)+'\nCIPHERTEXT='+b(c)}</script></main><script src="../ui.js"></script></body></html>
