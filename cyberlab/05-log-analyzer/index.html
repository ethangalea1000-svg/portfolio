<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log Analyzer</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px}textarea{width:100%;height:220px}button{padding:10px}</style><link rel="stylesheet" href="../ui.css"><link rel="icon" href="../../logo.png" type="image/png"></head><body><div class="cyberlab-brandbar"><a class="brand-main" href="../"><img src="../../logo.png" alt="Logo Ethan GALEA"><span>CyberLab</span></a><span class="pill">ETHAN GALEA</span><a href="../">Projets</a><a href="../collection/">Collection</a><a href="../questionnaire/">Questionnaire</a><a href="../account/">Connexion</a><a href="https://ethangalea1000-svg.github.io/portfolio/">Portfolio</a></div><main class="cyber-project-page"><h1>Log Analyzer</h1><p>Analyse uniquement le texte de journal que tu fournis.</p><textarea id="l">2026-09-19 INFO login ok\n2026-09-19 WARN failed login\n2026-09-19 WARN failed login\n2026-09-19 ERROR service unavailable</textarea><button onclick="go()">Analyser</button><pre id="o"></pre><script>function go(){const x=l.value.split(/\n/);const c={INFO:0,WARN:0,ERROR:0};x.forEach(v=>{for(const k in c)if(v.includes(k))c[k]++});o.textContent=JSON.stringify(c,null,2)+'\nLignes : '+x.length}</script></main><script src="../ui.js"></script></body></html>
